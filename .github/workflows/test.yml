name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build bundle
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Verify the committed main.js matches src
        run: |
          if ! git diff --quiet -- main.js; then
            echo "::error::main.js is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff -- main.js | head -50
            exit 1
          fi
