name: release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm test
      - name: Build installable zip
        run: npm run zip
      - name: Check tag matches manifest version
        run: |
          V=$(node -p "require('./manifest.json').version")
          if [ "$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != manifest version $V"
            exit 1
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            tdrive-sync-*.zip
          generate_release_notes: true
